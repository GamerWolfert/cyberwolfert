name: release
# Bouwt ALLES in de cloud bij een versietag (bv. v1.8.0):
# APK + Windows EXE-zip + Web-zip + alles-in-1 bundle als GitHub Release.
# De Mini-PC haalt de release automatisch op (scripts/minipc-release-sync.sh).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
      - run: flutter pub get
        working-directory: app
      - name: Android release-tekening klaarzetten
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
              "$GITHUB_WORKSPACE/app/android/keystore.jks" > android/key.properties
            echo "release-tekening gezet (Play Protect accepteert dit beter dan een debug-tekening)"
          else
            echo "geen ANDROID_KEYSTORE_BASE64 secret — debug-tekening"
          fi
        working-directory: app
      - run: flutter build apk --release --dart-define=API_BASE_URL=http://192.168.1.42:43711/api
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release --dart-define=API_BASE_URL=http://192.168.1.42:43711/api
        working-directory: app
      - run: Compress-Archive -Path app\build\windows\x64\runner\Release\* -DestinationPath CyberWolfert-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: CyberWolfert-Windows.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
      - run: flutter pub get
        working-directory: app
      - run: flutter build web --release
        working-directory: app
      - run: cd app/build && zip -qr ../CyberWolfert-web.zip web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: app/CyberWolfert-web.zip

  publish:
    needs: [android, windows, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cp artifacts/apk/app-release.apk CyberWolfert.apk
          cp artifacts/windows/CyberWolfert-Windows.zip .
          cp artifacts/web/CyberWolfert-web.zip .
          printf 'CyberWolfert installeren\n=========================\nAndroid: open CyberWolfert.apk en installeer.\n  -> Android zegt "App geblokkeerd om je apparaat te beschermen"?\n     Tik op Details en dan op "Toch installeren".\n     Werkt dat niet: Play Protect even uitzetten (Play Store > profilicoon > Play Protect > scans uitschakelen), installeren, en daarna weer aanzetten.\n  -> Staat er "App niet geïnstalleerd" (verouderde versie met andere tekening)?\n     Verwijder eerst de oude CyberWolfert-app en installeer daarna de nieuwe APK opnieuw.\nWindows: pak CyberWolfert-Windows.zip uit en start cyberwolfert_browser.exe.\nAlles-in-1: pak CyberWolfert-apps.zip uit.\n' > INSTALLEREN-LEESMIJ.txt
          zip -qr CyberWolfert-apps.zip CyberWolfert.apk CyberWolfert-Windows.zip INSTALLEREN-LEESMIJ.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            CyberWolfert.apk
            CyberWolfert-Windows.zip
            CyberWolfert-web.zip
            CyberWolfert-apps.zip
            backend/version.json
          body: CyberWolfert ${{ github.ref_name }} — APK, Windows, web en alles-in-1 bundle.
