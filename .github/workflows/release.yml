name: release
# Bouwt ALLES in de cloud bij een versietag (bv. v1.8.0):
# APK + Windows EXE-zip + Web-zip + alles-in-1 bundle als GitHub Release.
# De Mini-PC haalt de release automatisch op (scripts/minipc-release-sync.sh).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release --dart-define=API_BASE_URL=http://192.168.1.42:43711/api
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release --dart-define=API_BASE_URL=http://192.168.1.42:43711/api
        working-directory: app
      - run: Compress-Archive -Path app\build\windows\x64\runner\Release\* -DestinationPath CyberWolfert-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: CyberWolfert-Windows.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build web --release
        working-directory: app
      - run: cd app/build && zip -qr ../CyberWolfert-web.zip web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: app/CyberWolfert-web.zip

  publish:
    needs: [android, windows, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cp artifacts/apk/app-release.apk CyberWolfert.apk
          cp artifacts/windows/CyberWolfert-Windows.zip .
          cp artifacts/web/CyberWolfert-web.zip .
          printf 'CyberWolfert installeren\n=========================\nAndroid: open CyberWolfert.apk en installeer.\nWindows: pak CyberWolfert-Windows.zip uit en start cyberwolfert_browser.exe.\nAlles-in-1: pak CyberWolfert-apps.zip uit.\n' > INSTALLEREN-LEESMIJ.txt
          zip -qr CyberWolfert-apps.zip CyberWolfert.apk CyberWolfert-Windows.zip INSTALLEREN-LEESMIJ.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            CyberWolfert.apk
            CyberWolfert-Windows.zip
            CyberWolfert-web.zip
            CyberWolfert-apps.zip
            backend/version.json
          body: CyberWolfert ${{ github.ref_name }} — APK, Windows, web en alles-in-1 bundle.
