name: cyberwolfert_browser
description: CyberWolfert Browser met WolfPulse zoekmachine en CyberWolf AI-assistent.
publish_to: 'none'
version: 2.5.3+27

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  webview_flutter: ^4.7.0
  # Ingebedde Edge-browser op Windows (alleen daar gebruikt)
  webview_windows: ^0.2.1
  image_picker: ^1.0.8
  url_launcher: ^6.2.5
  google_sign_in: ^6.3.0
  flutter_svg: ^2.0.17
  geolocator: ^13.0.2
  web: ^1.1.1
  # Automatisch updaten (Android APK download + installeren)
  path_provider: ^2.1.4
  open_file: ^3.5.10
  # Startsound bij opstarten (+ eigen mp3 uploaden)
  audioplayers: ^6.1.0
  file_picker: ^13.1.0
  # AI-antwoorden mooi weergeven (codeblokken, lijsten, vet)
  flutter_markdown: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/sound.mp3
    # assets/night_bg.jpg toevoegen zodra het bestand er is (foto-achtergrond)
    - assets/brands/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
